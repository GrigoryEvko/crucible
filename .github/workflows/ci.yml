# Crucible CI — GitHub-hosted, full-coverage, no compromises.
#
# Single workflow: on every push (and PR / manual dispatch) it builds and tests
# the tip commit on free GitHub-hosted Linux runners (x86_64 + aarch64). No
# self-hosted runners (security). Runs are NEVER cancelled (no `concurrency`
# block), so history stays observable and bisectable.
#
# Tiers:
#   * guards  — bash/ripgrep discipline suite. ubuntu-latest, no compiler.
#   * patched-gcc — builds the patched GCC for each arch with
#               `setup gcc` (utils/assay/setup/gcc.py), and caches the install
#               (.github/workflows/patched-gcc.yml).
#   * build   — matrix(arch × preset) full compile + ctest, in a fedora:44
#               container with the patched GCC 16.2.1
#               (CRUCIBLE_CXX=/opt/crucible-gcc/usr/bin/g++-16p).
#               BPF substrate ENABLED. aarch64 regenerates vmlinux.h from the
#               runner kernel's BTF. Presets carry the sanitizer choice.
#   * bench   — release+bench preset, COMPILE gate only.
#   * fuzz    — default+CRUCIBLE_FUZZ, build + run the Philox-seeded smoke.
#
# The toolchain: each job that compiles Crucible uses the patched GCC from the
# patched-gcc job, which is the upstream commit of the pin gcc of utils/pins.txt
# plus the patches in utils/toolchain/gcc/patches.  Local development builds the
# same compiler with the same command.  cmake/Toolchain-gcc16.cmake refuses a
# compiler without each fix, so no job can compile with the stock g++ of the
# container.  Each job that configures or tests runs the CMake and the ctest
# that the rows of cmake of utils/pins.txt pin (.github/actions/pinned-cmake).
#
# Caching (public repo, free cache): ccache wraps the compiler — objects restored
# per (arch,preset) across runs, split restore/save so even a failed run banks
# partial compile progress.
#
# ============================================================================
# BILLING — THIS PIPELINE COSTS $0. KEEP IT THAT WAY. DO NOT CHANGE.
# ============================================================================
# Per GitHub Actions billing: standard GitHub-hosted runners are FREE, with NO
# minute cap, for PUBLIC repositories. The monthly free-minute quota
# (2,000/mo on Free) applies to PRIVATE repos only — it does not apply here.
# These invariants keep every run permanently free. Violating any one bills:
#
#   1. Repo stays PUBLIC. Flipping to private turns on the per-minute quota +
#      overage billing (Linux $0.006/min, arm64 $0.005/min, Windows $0.010/min).
#
#   2. Standard runners ONLY. Use exactly the labels below — `ubuntu-latest`,
#      `ubuntu-24.04` (x64), `ubuntu-24.04-arm` (arm64, GA + free for public).
#      NEVER add a "larger runner" (runner group, `*-4-core`/`*-8-core`/`xl`,
#      GPU, or extra-RAM/storage SKU): larger runners are ALWAYS billed, even on
#      public repos. The fedora:44 container is free — billing is by the host
#      runner, not the container.
#
#   3. NEVER raise the repo's Actions cache limit above the default 10 GB. Our
#      per-(arch,preset) ccache caches can total >10 GB; that is fine — GitHub
#      auto-evicts LRU caches to stay under 10 GB (free, costs only a cache
#      miss). You are billed for cache ONLY if you manually raise the limit and
#      exceed it ($0.07/GiB-month). Also: do NOT add upload-artifact.
# ============================================================================

name: ci

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Node 20 JS-action runtime is deprecated (forced to Node 24 on 2026-06-16,
# removed 2026-09-16). checkout is @v5 (Node-24-native); actions/cache has no
# Node-24 major yet, so this workflow-level opt-in forces every JS action onto
# Node 24 now. Drop once actions/cache ships a Node-24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Toolchain-FREE discipline guards. Stock ubuntu-latest, no compiler, no
  # CMake configure — pure source-tree scans.
  # ---------------------------------------------------------------------------
  guards:
    name: discipline guards (toolchain-free)
    runs-on: ubuntu-latest
    steps:
      # The rule decide-cite-ratio dates each procedure of the catalog from the
      # history of Decide.h, so this job needs the whole history.  The rule does
      # not apply to a shallow clone.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ripgrep and fd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep fd-find

      # The masters utils/bin/guard, utils/bin/loop and utils/bin/setup refuse
      # a Python that is older than 3.14, and the runner image ships an older one.
      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The AST guards parse C++ rather than scan text, and they parse it with
      # the pinned fork of the tree-sitter C++ grammar.  The upstream grammar
      # reports an error on roughly one construct in three of this tree, and the
      # fork's grammar declares ABI 1019, which no upstream runtime loads.  So
      # the kit carries both halves, and the installer is the only way onto it.
      #
      # `setup install` (utils/assay/setup/install.py) verifies the release
      # tarball against the SHA256 of its pin in utils/pins.txt, checks the
      # grammar and runtime lineage in the kit manifest, and parses a fixture
      # that only the fork parses.  A failure installs nothing.  The kit lands
      # in the tools directory of the shared cache root (assay.core.cache,
      # under the home directory of the runner), and the install appends its
      # bin directory to GITHUB_PATH.  The test of the install runs first.
      #
      # This step stays FREE: the download is one 43 MB release asset from
      # GitHub, and no runner label changes.
      - name: Install the pinned tree-sitter C++ kit (self-test + install)
        run: |
          python3 utils/bin/guard selftest tests.setup.test_install
          python3 utils/bin/setup install tree-sitter

      # The guards read shell scripts with ast-grep's bash grammar, so a git
      # call inside a heredoc body or a comment is not a call.  The install
      # verifies the release zip against the SHA256 of its pin and runs a
      # fixture through the binary.  The binary lands in the tools directory
      # of the shared cache root.
      - name: Install the pinned ast-grep
        run: python3 utils/bin/setup install ast-grep

      # The rule types runs the pinned mypy, and the rule python-lint runs the
      # pinned ruff.  pip installs each wheel with the SHA-256 of its pin into
      # the tools directory of the shared cache root.
      - name: Install the pinned mypy and ruff
        run: python3 utils/bin/setup install mypy ruff

      # The plants of the rule test-registration configure a scratch project.
      - name: Install the pinned CMake and ctest
        uses: ./.github/actions/pinned-cmake

      # The rules of the engine tsast read the parse trees of the pinned kit,
      # and one run reads each tree one time.  The rule parse-clean refuses a
      # file that does not parse, because each other rule cannot see into it.
      # The witness runs each rule on its plants of utils/plants/.
      - name: the rules of the engine tsast (witness + scan)
        run: |
          python3 utils/bin/guard selftest readers.tsast
          python3 utils/bin/guard witness --engine tsast
          python3 utils/bin/guard check --engine tsast

      # The rules of the engine meta read the registry, the ledgers, the plants,
      # the modules of the package, the prose and the git history.  The witness
      # runs each rule on its plants of utils/plants/.  The rule structured-reads
      # reads shell with the pinned ast-grep, and the rules types and
      # python-lint run the pinned mypy and ruff, that the steps above install.
      # The rule test-registration reads the tests of a configured build, so its
      # scan runs in the build legs through ctest, and here it does not apply.
      # The rule clang-format needs clang-format 22 or 23, which this runner does
      # not install, so it runs in the build legs through ctest.
      - name: the rules of the engine meta (witness + scan)
        run: |
          for rule in history layout registry-shape rule-implementations rule-witness structured-reads \
                      test-registration determinism exit-codes import-closure job-owners module-tests no-shell \
                      one-implementation python-lint ste-prose typed-data types prose-bans admitted-audit \
                      decide-cite-ratio; do
            python3 utils/bin/guard witness --rule "$rule"
          done
          python3 utils/bin/guard check --engine meta

      - name: erased brand spellings only decrease (self-test + scan)
        run: |
          python3 utils/bin/guard check --rule brand-drain --self-test
          python3 utils/bin/guard check --rule brand-drain

      - name: syscall capability admission (self-test + scan)
        run: |
          python3 utils/bin/guard check --rule syscall-capability --self-test
          python3 utils/bin/guard check --rule syscall-capability

      - name: mint inventory (self-test + drift check + HS14 floor)
        run: |
          python3 utils/bin/guard selftest loop.derive.mint_inventory
          python3 utils/bin/loop derive mint-inventory --check
          python3 utils/bin/guard check --rule mint-floor

      - name: unchecked access context only in reviewed walks (self-test + scan)
        run: |
          python3 utils/bin/guard check --rule no-unchecked-access --self-test
          python3 utils/bin/guard check --rule no-unchecked-access

      - name: detail namespaces of foundation and fixy only inside the layers (self-test + scan)
        run: |
          python3 utils/bin/guard check --rule detail-namespace --self-test
          python3 utils/bin/guard check --rule detail-namespace

      - name: init and background doors opened only from reviewed entry points (self-test + scan)
        run: |
          python3 utils/bin/guard check --rule ctx-init-door --self-test
          python3 utils/bin/guard check --rule ctx-init-door

      - name: session oracle drift (check)
        run: python3 utils/bin/guard check --rule session-oracle

      - name: check report format and the measured rules (self-test)
        run: python3 utils/bin/guard selftest core.report

  # ---------------------------------------------------------------------------
  # The patched GCC, built once for each arch and cached.  The jobs below
  # restore it with the key that this job gives.
  # ---------------------------------------------------------------------------
  patched-gcc:
    uses: ./.github/workflows/patched-gcc.yml

  # ---------------------------------------------------------------------------
  # Full compile + run + negative-compile + golden-binary suite. Matrix over
  # (arch × preset) in a fedora:44 container with the patched GCC 16.2.1. BPF
  # substrate ENABLED — the perf/network BPF programs + crucible_vessel all
  # compile. fail-fast:false: an aarch64-specific issue (e.g. BTF availability)
  # never cancels the x86_64 legs.
  # ---------------------------------------------------------------------------
  build:
    name: build+test ${{ matrix.arch }} / ${{ matrix.preset }}
    needs: [guards, patched-gcc]
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    # aarch64 is non-blocking while the arm legs prove out. Both prior
    # blockers are now fixed: (1) the foundation::simd facade
    # (include/foundation/Simd.h) lowers through [[gnu::vector_size]]
    # builtins, not the __SSE2__-gated <simd> of libstdc++, so it is
    # portable to arm; (2) canopy/Hlc.h's
    # lock-free 128-bit atomic requirement — GCC 16 only provides
    # one with FEAT_LSE128 (armv9.4-a) hardware the free runners lack, so
    # Hlc.h now carries a spinlock-guarded fallback for that case (build
    # succeeds; now() takes the locked path on non-LSE128 arm). Left
    # non-blocking until CI confirms the arm legs are reliably green, then
    # flip to blocking. x86_64 remains the enforced full-coverage gate.
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # BILLING: `runner` MUST stay a standard free label (ubuntu-24.04 /
          # ubuntu-24.04-arm). NEVER swap in a larger runner — see the billing
          # block above. Larger runners are always billed.
          # x86_64 — committed vmlinux.h is x86_64, no regen needed.
          - { arch: x86_64,  runner: ubuntu-24.04,     preset: default,  jobs: 3, regen_btf: false, run_tests: true  }
          - { arch: x86_64,  runner: ubuntu-24.04,     preset: tsan,     jobs: 3, regen_btf: false, run_tests: true  }
          - { arch: x86_64,  runner: ubuntu-24.04,     preset: release,  jobs: 2, regen_btf: false, run_tests: true  }
          - { arch: x86_64,  runner: ubuntu-24.04,     preset: analyzer, jobs: 2, regen_btf: false, run_tests: false }
          # ubsan-strict puts the full UBSan set on every target, with signed
          # overflow undefined.  It is the only leg that reports a wrapping
          # signed add.  verify builds Release code with the contracts armed.
          - { arch: x86_64,  runner: ubuntu-24.04,     preset: ubsan-strict, jobs: 3, regen_btf: false, run_tests: true }
          - { arch: x86_64,  runner: ubuntu-24.04,     preset: verify,   jobs: 2, regen_btf: false, run_tests: true  }
          # aarch64 — regenerate vmlinux.h from the runner kernel's BTF.
          - { arch: aarch64, runner: ubuntu-24.04-arm, preset: default,  jobs: 3, regen_btf: true,  run_tests: true  }
          - { arch: aarch64, runner: ubuntu-24.04-arm, preset: tsan,     jobs: 3, regen_btf: true,  run_tests: true  }
          - { arch: aarch64, runner: ubuntu-24.04-arm, preset: release,  jobs: 2, regen_btf: true,  run_tests: true  }
          - { arch: aarch64, runner: ubuntu-24.04-arm, preset: ubsan-strict, jobs: 3, regen_btf: true, run_tests: true }
    env:
      CRUCIBLE_CXX: /opt/crucible-gcc/usr/bin/g++-16p
      # ccache lives at an absolute path (survives the checkout wipe) and is
      # cached as a whole directory per arch+preset.
      CCACHE_DIR: /ccache
      # ~14 GB runner disk shared with the container + dnf cache + build tree;
      # 2 G keeps the cache-save post-step from wedging and stays under the
      # 10 GB/repo Actions cache quota.
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPRESS: "true"
    steps:
      # Minimal tooling actions/cache needs to pack/unpack inside the container.
      - name: Bootstrap cache tooling
        run: dnf install -y --setopt=install_weak_deps=False tar zstd

      - name: Restore dnf package cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/libdnf5
            /var/cache/dnf
          key: dnf-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: dnf-${{ matrix.arch }}-

      # Full toolchain + BPF stack. clang+xxd+bpftool flip
      # CRUCIBLE_HAVE_BPF=ON (cmake/CrucibleBpf.cmake); libbpf-devel provides
      # bpf_helpers.h. gcc-c++ supplies binutils, the glibc files and the GMP,
      # MPFR and MPC libraries that the patched GCC runs on, and isl is the
      # last library it needs.  The patched GCC carries its own sanitizer
      # runtimes and libstdc++.  gmp-devel gives gmp.h, which the GCC plugin
      # headers include when the configure step builds the contract plugin.
      # `setup install` downloads each pinned tool with Python, checks its
      # SHA256 and unpacks it, so the job needs no download tool.  CMake comes
      # from the pin, not dnf.  pip installs the pinned mypy and ruff.
      - name: Install toolchain + BPF stack + ccache
        run: >
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=1
          gcc-c++ isl gmp-devel ninja-build git ripgrep ccache diffutils
          clang llvm clang-tools-extra xxd bpftool libbpf-devel python3-pip

      # The patched GCC that the patched-gcc job built.  CRUCIBLE_CXX names it.
      - name: Restore the patched GCC
        uses: actions/cache/restore@v4
        with:
          path: /opt/crucible-gcc
          key: ${{ needs.patched-gcc.outputs.key }}-${{ matrix.arch }}
          fail-on-cache-miss: true

      # valgrind runs the constant-time taint tests in test/ct.  The tests
      # target x86-64-v3, so only the x86_64 legs install it.
      - name: Install valgrind (x86_64)
        if: ${{ matrix.arch == 'x86_64' }}
        run: >
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=1
          valgrind valgrind-devel

      # Split restore/save: the combined actions/cache@v4 only saves in its
      # post-step on JOB SUCCESS, so a failing preset never persists its
      # ccache and restarts cold every run (perpetual 0% hits). restore@v4
      # here + save@v4 with if:always() below banks partial compile progress
      # from failed runs too. Unique ${run_id} in the key means save never
      # collides; restore-keys prefix-fallback picks up the latest prior cache.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.preset }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ matrix.preset }}-${{ github.ref_name }}-
            ccache-${{ matrix.arch }}-${{ matrix.preset }}-main-
            ccache-${{ matrix.arch }}-${{ matrix.preset }}-

      # Full history: the test guard_decide_cite_ratio dates each procedure of
      # the catalog from the history of Decide.h, and the rule does not apply to
      # a shallow clone.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The user of the container does not own the checkout, so git refuses
      # the work tree, and each guard that reads the tree through git fails.
      - name: Mark the checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ctest runs the script-backed guards under the ci_guard label, and the
      # AST guards among them parse C++ with the pinned kit.  Install it before
      # the compile rather than before the test step, so a kit failure costs one
      # download instead of a full build.  The pin covers both matrix arches.
      - name: Install the pinned tree-sitter C++ kit
        run: python3 utils/bin/setup install tree-sitter

      # The rule structured-reads reads shell scripts with the pinned ast-grep.
      - name: Install the pinned ast-grep
        run: python3 utils/bin/setup install ast-grep

      # The rule types runs the pinned mypy, and the rule python-lint runs the
      # pinned ruff.  pip of the package python3-pip installs each wheel with
      # the SHA-256 of its pin.
      - name: Install the pinned mypy and ruff
        run: python3 utils/bin/setup install mypy ruff

      - name: Install the pinned CMake and ctest
        uses: ./.github/actions/pinned-cmake

      # The committed vmlinux.h is an x86_64 BTF dump; on aarch64 the BPF
      # programs need the matching arm64 layout. Regenerate it from the runner
      # kernel's BTF (CO-RE: compile-time types, load-time relocation). Fails
      # loudly if BTF is absent so the cause is unambiguous.
      - name: Regenerate vmlinux.h from runner BTF (aarch64)
        if: ${{ matrix.regen_btf }}
        run: |
          test -r /sys/kernel/btf/vmlinux || { echo "::error::/sys/kernel/btf/vmlinux not readable in container"; exit 1; }
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > include/crucible/perf/bpf/vmlinux.h
          echo "regenerated $(wc -l < include/crucible/perf/bpf/vmlinux.h) lines for ${{ matrix.arch }}"

      # Presets carry the sanitizer/build-type choice; no -DCRUCIBLE_* overrides
      # except the ccache launchers (which compose with cmake/Toolchain-gcc16.cmake).
      # The x86_64 default leg also sets CRUCIBLE_REQUIRE_CT_TAINT.  The
      # configure step then fails when valgrind is missing, and the taint tests
      # cannot become disabled in silence.
      - name: Configure (${{ matrix.preset }}, patched gcc-16, BPF on, ccache)
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.arch == 'x86_64' && matrix.preset == 'default' && '-DCRUCIBLE_REQUIRE_CT_TAINT=ON' || '' }}

      - name: Reset ccache stats
        run: ccache -z

      # -jN overrides the preset's jobs:96. 4 vCPU / 16 GB runners; sanitizer
      # and -fanalyzer TUs are memory-heavy, so jobs is tuned per preset. The
      # analyzer preset is restricted to the `crucible` library target —
      # -fanalyzer over the full ~1000-TU test tree would blow the wall-clock
      # budget, and the static-analysis findings that matter live in the
      # compiled library surface.
      - name: Build
        run: >
          cmake --build --preset ${{ matrix.preset }} -j ${{ matrix.jobs }}
          ${{ matrix.preset == 'analyzer' && '--target crucible' || '' }}

      # Each header with a check file compiles alone at the operation limit of
      # a header alone (test/layer/CMakeLists.txt).  The target is outside
      # `all`, because it adds about 4 s of wall time to a clean build.  The
      # release leg builds it too, because -march=native compiles the SIMD
      # arms of a header, and the Debug build does not compile them.
      - name: Build the headers alone at the operation limit
        if: ${{ matrix.preset == 'default' || matrix.preset == 'release' }}
        run: cmake --build --preset ${{ matrix.preset }} -j ${{ matrix.jobs }} --target layer_alone

      - name: ccache stats
        run: ccache -s

      # A second configure, and the two builds after it, compile nothing.  The
      # check also refuses a configure that makes a link again with the same
      # target, and a recorded dependency that does not exist.  The analyzer
      # leg builds only the crucible library, so it skips the check.
      - name: Re-configure compiles nothing
        if: ${{ matrix.preset != 'analyzer' }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
        run: >
          python3 utils/bin/guard check --rule reconfigure-noop
          --build-dir ${{ matrix.preset == 'default' && 'build' || format('build-{0}', matrix.preset) }}

      # Skipped for the analyzer preset (build-time -fanalyzer findings are its coverage).
      # The test launcher holds the rules test-time and test-memory for each test
      # (cmake/TestLauncher.cmake), and the fixture driver holds them for each fixture.
      - name: Test
        if: ${{ matrix.run_tests }}
        run: ctest --preset ${{ matrix.preset }} -j ${{ matrix.jobs }}

      # Two ledgers depend on the build kind and the target tier
      # (utils/assay/core/target.py).  The rule quarantine counts its findings
      # of each file, kind and entity.  The rule artifact-symbols holds the
      # libstdc++ symbols of the libraries.  For a build that a ledger does not
      # hold, each rule prints one line with its tier and the tiers of the
      # ledger, for example on a runner of a different native tier.  The rule
      # quarantine then exits 77.  The rule artifact-symbols then judges only
      # the throws and the classes of the libraries.  Each rule then prints the
      # rows of the build, and it prints them after a failure too.  Only CI
      # builds aarch64.  `guard write --rule RULE --import LOG` puts the rows
      # of an aarch64 leg into the ledger of each rule.  ctest shows no output
      # of a test that passes or that it skips.  This step runs the two rules
      # again, also after a failed test step.  The step "Check warnings"
      # annotates the warnings of the two tests, and this step prints its
      # findings as plain lines.
      - name: Ledgers of the build kind
        if: ${{ !cancelled() && (matrix.preset == 'default' || matrix.preset == 'release') }}
        env:
          GITHUB_ACTIONS: "false"
          LEDGER_BUILD: ${{ matrix.preset == 'default' && 'build' || format('build-{0}', matrix.preset) }}
        run: |
          failed=0
          for rule in quarantine artifact-symbols; do
            status=0
            python3 utils/bin/guard check --rule "$rule" --build-dir "$LEDGER_BUILD" || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 77 ]; then failed=1; fi
          done
          exit "$failed"

      # A compile-time check that passes with warnings writes them to
      # <build>/check-warnings (utils/assay/core/report.py), because ctest
      # shows no output of a test that passes.  This step prints each warning
      # as an annotation of the run, and the time totals of the build, which
      # give warnings only.  It fails only on a malformed warnings file.
      - name: Check warnings
        if: always()
        run: >
          python3 utils/bin/guard warnings
          ${{ matrix.preset == 'default' && 'build' || format('build-{0}', matrix.preset) }}

      # Persist ccache even when Build/Test FAILED or the run was CANCELLED.
      # `if: always()` is load-bearing: it runs in the cancellation grace
      # window too, so a killed/unfinished run still banks the objects it DID
      # compile, and the next run resumes warm (restore-keys prefix-fallback
      # picks up the newest prior cache). Cache thus accumulates monotonically
      # across runs. Do NOT weaken to success()/failure() — that silently drops
      # the carry-forward from unfinished runs.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.preset }}-${{ github.ref_name }}-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Vessel native-dispatch COMPILE gate. x86_64 only.
  #
  # crucible_dispatch is the PyTorch-facing half of the Vessel, and no preset
  # builds it: vessel/torch/CMakeLists.txt adds the target only when TORCH_DIR
  # points at a tree with torch/include, and nothing set TORCH_DIR. The target
  # was therefore skipped in silence for four months while the Crucible-side
  # APIs it calls moved underneath it, and the breakage surfaced only when
  # somebody built it by hand. This job exists so that cannot recur.
  #
  # It is a COMPILE gate, not a link gate. crucible_fallback.cpp calls
  # c10::CrucibleState::get_tls_state(), which lives in the CrucibleState.cpp
  # the patch adds to c10 -- a stock PyTorch wheel cannot resolve it, and
  # rebuilding PyTorch does not fit a free runner. So the job builds the object
  # file, which is where every defect this job is meant to catch lives.
  # ---------------------------------------------------------------------------
  vessel-dispatch:
    name: vessel native dispatch (compile gate, x86_64)
    needs: [guards, patched-gcc]
    runs-on: ubuntu-24.04
    container: fedora:44
    # Non-blocking while this leg proves out, matching the aarch64 legs
    # above. Flip to blocking once it has been green for a few runs. The
    # step-level `::error::` annotations below fire either way, so a failure is
    # visible in the run summary rather than only in the log.
    continue-on-error: true
    env:
      CRUCIBLE_CXX: /opt/crucible-gcc/usr/bin/g++-16p
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPRESS: "true"
    steps:
      - name: Bootstrap cache tooling
        run: dnf install -y --setopt=install_weak_deps=False tar zstd

      - name: Install toolchain + BPF stack + ccache + pip
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc-c++ isl gmp-devel ninja-build git ripgrep ccache diffutils patch
          clang llvm xxd bpftool libbpf-devel
          python3 python3-pip curl

      - name: Restore the patched GCC
        uses: actions/cache/restore@v4
        with:
          path: /opt/crucible-gcc
          key: ${{ needs.patched-gcc.outputs.key }}-x86_64
          fail-on-cache-miss: true

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /ccache
          key: ccache-x86_64-vessel-dispatch-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-x86_64-vessel-dispatch-${{ github.ref_name }}-
            ccache-x86_64-vessel-dispatch-main-

      - name: Checkout
        uses: actions/checkout@v5

      # The user of the container does not own the checkout (see build job).
      - name: Mark the checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the pinned CMake and ctest
        uses: ./.github/actions/pinned-cmake

      # CPU wheel only: the CUDA wheels are several GB and the runner shares
      # ~14 GB with the container. The wheel ships the full C++ header tree at
      # site-packages/torch/include, which is all a compile gate needs.
      - name: Install PyTorch CPU wheel (headers only are used)
        run: |
          python3 -m pip install --no-cache-dir --break-system-packages \
            --index-url https://download.pytorch.org/whl/cpu torch
          python3 -c "import torch; print('torch', torch.__version__)"

      # TORCH_DIR is the directory CONTAINING torch/, i.e. site-packages.
      - name: Locate the wheel and apply the Crucible patch to its headers
        run: |
          TORCH_DIR=$(python3 -c "import torch, os; print(os.path.dirname(os.path.dirname(torch.__file__)))")
          echo "TORCH_DIR=$TORCH_DIR" >> "$GITHUB_ENV"
          test -d "$TORCH_DIR/torch/include" || {
            echo "::error::no torch/include under $TORCH_DIR"; exit 1; }
          # The patch targets a PyTorch source tree; the wheel's header copy is
          # the same files, so -p1 from torch/include lands DispatchKey.h and
          # drops in the new CrucibleState.h. Hunks for .cpp files are not
          # present in a header tree and are expected to be skipped -- only
          # DispatchKey.h and CrucibleState.h decide this step.
          cd "$TORCH_DIR/torch/include"
          patch -p1 -N -t --no-backup-if-mismatch \
            < "$GITHUB_WORKSPACE/patches/pytorch-crucible-integration.patch" || true
          test -f c10/core/CrucibleState.h || {
            echo "::error::patch did not produce c10/core/CrucibleState.h -- patches/pytorch-crucible-integration.patch no longer applies to this PyTorch"; exit 1; }
          # The layout of the patched DispatchKey enum is checked by the
          # compiler: vessel/torch/crucible_fallback.cpp asserts that Crucible
          # exists, that it is the last functionality key, and that
          # DeferredInit is gone. The compile step below runs those asserts.
          rm -f c10/core/CrucibleState.cpp c10/core/*.rej c10/core/*.orig

          # The two assertions below read the patch FILE, not the tree the
          # patch was just applied to, because neither hunk can land in a
          # wheel's header copy:
          #   - the DEF_ONE hunk edits torch/csrc/utils/python_dispatch.cpp,
          #     and a header tree ships no .cpp;
          #   - the ThreadLocalState hunk is spelled aten/src/ATen/... in a
          #     source tree, and the wheel keeps that header at ATen/..., so
          #     -p1 finds no file and skips it.
          # They are drift gates on the patch: a regenerated patch that loses
          # either hunk reddens here instead of at the next rebuild of the
          # fork, where the symptom is a missing Python enum name or a silent
          # INACTIVE mode on the autograd engine's worker threads.
          PATCH="$GITHUB_WORKSPACE/patches/pytorch-crucible-integration.patch"
          grep -q '^+      DEF_ONE(Crucible)' "$PATCH" || {
            echo "::error::the patch no longer adds DEF_ONE(Crucible) to the pybind DispatchKey enum -- torch._C.DispatchKey.Crucible would not exist and _parse_dispatch_key would print DispatchKey.???"; exit 1; }
          grep -q '^+  c10::CrucibleState crucible_tls_;' "$PATCH" || {
            echo "::error::the patch no longer adds the c10::CrucibleState member to at::ThreadLocalState -- the mode and the context stop travelling to the autograd engine's per-device workers, and the backward window of an accelerator model drops out of the trace"; exit 1; }

      - name: Configure with TORCH_DIR
        run: >
          cmake --preset default
          -DTORCH_DIR="$TORCH_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # The whole point of this job. vessel/torch/CMakeLists.txt SKIPS the
      # target when it cannot find the headers, and a skipped target is what
      # let this rot unnoticed. A skip here is a failure, not a pass.
      - name: Assert the dispatch target was actually generated
        run: |
          cmake --build build --target help 2>/dev/null | grep -qw crucible_dispatch \
            || ninja -C build -t targets all | grep -q crucible_dispatch \
            || { echo "::error::crucible_dispatch was not generated -- TORCH_DIR was not honoured, so this job would have passed without compiling anything"; exit 1; }

      - name: Reset ccache stats
        run: ccache -z

      # Object, not library: see the link note in the job header.
      - name: Compile crucible_fallback.cpp
        run: >
          cmake --build build -j 3
          --target vessel/torch/CMakeFiles/crucible_dispatch.dir/crucible_fallback.cpp.o

      - name: ccache stats
        run: ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /ccache
          key: ccache-x86_64-vessel-dispatch-${{ github.ref_name }}-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Benchmark COMPILE gate. Shared-runner perf numbers are meaningless (noisy /
  # throttled), so this builds the bench tree to catch compile regressions and
  # does NOT run perf-gated assertions. x86_64 only.
  # ---------------------------------------------------------------------------
  bench:
    name: bench (compile gate, x86_64)
    needs: [guards, patched-gcc]
    # Blocking: every bench target compiles under the bench preset, so a red
    # build here is a regression in a bench or in an API that a bench uses.
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      CRUCIBLE_CXX: /opt/crucible-gcc/usr/bin/g++-16p
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPRESS: "true"
    steps:
      - name: Bootstrap cache tooling
        run: dnf install -y --setopt=install_weak_deps=False tar zstd
      - name: Restore dnf package cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/libdnf5
            /var/cache/dnf
          key: dnf-x86_64-${{ github.run_id }}
          restore-keys: dnf-x86_64-
      - name: Install toolchain + BPF stack + ccache
        run: >
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=1
          gcc-c++ isl gmp-devel ninja-build git ripgrep ccache diffutils
          clang llvm xxd bpftool libbpf-devel curl
      - name: Restore the patched GCC
        uses: actions/cache/restore@v4
        with:
          path: /opt/crucible-gcc
          key: ${{ needs.patched-gcc.outputs.key }}-x86_64
          fail-on-cache-miss: true
      # Split restore/save so a failed compile still banks ccache (see build job).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /ccache
          key: ccache-x86_64-bench-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-x86_64-bench-${{ github.ref_name }}-
            ccache-x86_64-bench-main-
            ccache-x86_64-bench-
      - name: Checkout
        uses: actions/checkout@v5
      # The user of the container does not own the checkout (see build job).
      - name: Mark the checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned CMake and ctest
        uses: ./.github/actions/pinned-cmake
      - name: Configure (bench, ccache)
        run: >
          cmake --preset bench
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build benches
        run: cmake --build --preset bench -j 3
      - name: ccache stats
        run: ccache -s
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /ccache
          key: ccache-x86_64-bench-${{ github.ref_name }}-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Fuzz smoke. Property fuzzers are plain GCC + ASan/UBSan with Philox-seeded
  # input (deterministic, not flaky). Build + run the short --iters=1000 smoke.
  # x86_64 only.  The build also holds the benches, and it is the
  # configuration x86_64-debug-asan-bench-fuzz of the quarantine ledger.  valgrind gives the
  # headers that the default leg has, so the configurations agree.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (property smoke, x86_64)
    needs: [guards, patched-gcc]
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      CRUCIBLE_CXX: /opt/crucible-gcc/usr/bin/g++-16p
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPRESS: "true"
    steps:
      - name: Bootstrap cache tooling
        run: dnf install -y --setopt=install_weak_deps=False tar zstd
      - name: Restore dnf package cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/libdnf5
            /var/cache/dnf
          key: dnf-x86_64-${{ github.run_id }}
          restore-keys: dnf-x86_64-
      # The patched GCC carries its own sanitizer runtimes.
      - name: Install toolchain + BPF stack + ccache
        run: >
          dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=1
          gcc-c++ isl gmp-devel ninja-build git ripgrep ccache diffutils
          clang llvm xxd bpftool libbpf-devel curl valgrind valgrind-devel
      - name: Restore the patched GCC
        uses: actions/cache/restore@v4
        with:
          path: /opt/crucible-gcc
          key: ${{ needs.patched-gcc.outputs.key }}-x86_64
          fail-on-cache-miss: true
      # Split restore/save so a failed compile still banks ccache (see build job).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /ccache
          key: ccache-x86_64-fuzz-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-x86_64-fuzz-${{ github.ref_name }}-
            ccache-x86_64-fuzz-main-
            ccache-x86_64-fuzz-
      - name: Checkout
        uses: actions/checkout@v5
      # The user of the container does not own the checkout (see build job).
      - name: Mark the checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned CMake and ctest
        uses: ./.github/actions/pinned-cmake
      - name: Configure (default + CRUCIBLE_FUZZ + CRUCIBLE_BENCH, ccache)
        run: >
          cmake --preset default
          -DCRUCIBLE_FUZZ=ON
          -DCRUCIBLE_BENCH=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build fuzzers and benches
        run: cmake --build --preset default -j 3
      - name: ccache stats
        run: ccache -s
      - name: Run property-fuzz smoke
        run: ctest --preset default -j 3 -L fuzz_property
      # The configuration x86_64-debug-asan-bench-fuzz of the quarantine ledger
      # (see the step "Ledgers of the build kind" of the build job).
      - name: Quarantine ratchet
        if: ${{ !cancelled() }}
        env:
          GITHUB_ACTIONS: "false"
        run: |
          status=0
          python3 utils/bin/guard check --rule quarantine --build-dir build || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 77 ]; then exit "$status"; fi
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /ccache
          key: ccache-x86_64-fuzz-${{ github.ref_name }}-${{ github.run_id }}
