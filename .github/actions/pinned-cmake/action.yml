# The CMake and the ctest that the rows of cmake of utils/pins.txt pin.
#
# `setup install cmake` (utils/assay/setup/install.py) installs them into the
# tools directory of the shared cache root, and it puts their bin directory
# first in PATH for the steps after this action.  The Actions cache keeps the
# install directory.  Its key is the name of that directory, which carries the
# pinned version, the machine and the start of the pinned SHA256, and the hash
# of the install module.  A cache miss downloads one wheel of about 30 MB from
# PyPI.  The step that saves the cache runs at once after the install, so a job
# that fails after it still keeps the install.
#
# The job must check out the tree first, and it must have Python 3.14.
name: pinned CMake
description: Install the pinned CMake and ctest, and put them first in PATH.
runs:
  using: composite
  steps:
    - name: Find the install directory of the pinned CMake
      id: locate
      shell: bash
      run: |
        dir="$(python3 utils/bin/setup install --print-dir cmake)"
        printf 'dir=%s\nkey=%s-%s\n' "$dir" "${dir##*/}" "${{ hashFiles('utils/assay/setup/install.py') }}" \
          >> "$GITHUB_OUTPUT"

    - name: Restore the pinned CMake
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.locate.outputs.dir }}
        key: ${{ steps.locate.outputs.key }}

    - name: Install the pinned CMake
      shell: bash
      run: python3 utils/bin/setup install cmake

    - name: Save the pinned CMake
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.locate.outputs.dir }}
        key: ${{ steps.locate.outputs.key }}
